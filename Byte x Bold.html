<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte x Bold</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1f;--bg2:#0d1433;--card:#111a3d;--line:#22306b;--tx:#e8ecff;--mut:#8f9bd1;--red:#ff3b5c;--pur:#9b5cff;--blu:#3b8bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100vh;
background-image:radial-gradient(600px 300px at 90% -5%,rgba(155,92,255,.25),transparent),radial-gradient(500px 300px at 5% 10%,rgba(59,139,255,.2),transparent),radial-gradient(500px 250px at 50% 110%,rgba(255,59,92,.18),transparent)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:rgba(7,11,31,.85);position:sticky;top:0;backdrop-filter:blur(8px);z-index:5}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}
.logo b{background:linear-gradient(90deg,var(--red),var(--pur),var(--blu));-webkit-background-clip:text;background-clip:text;color:transparent}
nav a{color:var(--mut);text-decoration:none;margin-inline-start:18px;font-size:15px;cursor:pointer}
nav a.on,nav a:hover{color:var(--tx)}
main{max-width:1100px;margin:0 auto;padding:24px}
.hero{padding:34px 24px;border-radius:18px;background:linear-gradient(120deg,rgba(255,59,92,.18),rgba(155,92,255,.18),rgba(59,139,255,.18));border:1px solid var(--line);margin-bottom:26px}
.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.card::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red),var(--pur),var(--blu))}
.card video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.card .in{padding:12px 14px}.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0;color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px}
.panel h2{margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit}
input[type=file]{color:var(--mut);font:inherit;font-size:13px}
textarea{min-height:70px;resize:vertical}
button{border:0;color:#fff;font:inherit;font-weight:600;padding:10px 20px;border-radius:10px;cursor:pointer;background:linear-gradient(90deg,var(--red),var(--pur),var(--blu));margin-top:14px}
button:disabled{opacity:.5;cursor:wait}
button.del{background:transparent;border:1px solid var(--red);color:var(--red);padding:5px 12px;margin:0;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.msg{margin-top:10px;font-size:13px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.bar{height:6px;border-radius:4px;background:var(--bg2);margin-top:10px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--pur),var(--blu));transition:width .3s}
#admin:not(.hide){display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media(max-width:800px){#admin:not(.hide){grid-template-columns:1fr}}
.panel{margin-bottom:0}
.sec{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--red),var(--pur),var(--blu));border-radius:2px;opacity:.6}
.tabs{display:flex;gap:8px;background:var(--bg2);padding:5px;border-radius:12px;margin-bottom:6px}
.tab{flex:1;margin:0;padding:9px;background:transparent;color:var(--mut);font-size:14px}
.tab.on{background:linear-gradient(90deg,var(--red),var(--pur),var(--blu));color:#fff}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 12px;margin:12px 0 0;border:2px dashed var(--pur);border-radius:14px;background:rgba(155,92,255,.08);color:var(--tx);cursor:pointer;text-align:center;transition:.2s}
.drop:hover,.drop.over{background:rgba(59,139,255,.15);border-color:var(--blu)}
.drop b{font-size:16px;color:var(--tx)}.drop small{color:var(--mut)}
.yt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:16/9;text-decoration:none;color:#fff;background:linear-gradient(135deg,#3a0f2e,#2a1457,#0f2a6b)}
.yt span{font-size:34px;width:60px;height:60px;line-height:60px;text-align:center;border-radius:50%;background:var(--red);box-shadow:0 0 24px rgba(255,59,92,.6)}
.yt small{color:#ffd5dd}
.pill{display:inline-block;margin-top:12px;padding:8px 18px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(90deg,var(--red),var(--pur),var(--blu))}
#about p{line-height:2;margin:6px 0 0}
.dl{margin-top:10px;padding:6px 14px;font-size:13px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;margin-inline-end:8px;background:rgba(59,139,255,.2);color:#9cc4ff}
.badge.y{background:rgba(255,59,92,.2);color:#ff9fb0}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div class="logo">Byte <b>x</b> Bold</div>
  <nav><a id="nv-home" class="on" href="#home">ویدیوها</a><a href="#about">درباره من</a><a id="nv-admin" href="#admin">پنل مدیریت</a></nav>
</header>
<main>
  <section id="home">
    <div class="hero"><h1>پایتون، الکترونیک و تولید محتوا</h1><p>جدیدترین ویدیوهای چنل Byte x Bold</p></div>
    <h2 class="sec">آخرین ویدیوها</h2>
    <input type="text" id="s" placeholder="🔍 جست‌وجوی نام ویدیو..." style="margin-bottom:16px">
    <div class="grid" id="grid"></div>
    <div class="empty hide" id="empty">هنوز ویدیویی اضافه نشده است.</div>
    <h2 class="sec" style="margin-top:34px">درباره من</h2>
    <div class="panel" id="about"><h3 id="ab-name" style="margin:0"></h3><p id="ab-bio"></p><a id="ab-yt" class="pill hide" target="_blank" rel="noopener">کانال یوتوب من ▶</a></div>
  </section>
  <section id="admin" class="hide">
    <div class="panel">
      <h2>افزودن ویدیوی جدید</h2>
      <div class="tabs"><button class="tab on" id="tb-file">📁 آپلود فایل</button><button class="tab" id="tb-yt">▶ لینک یوتوب</button></div>
      <label>عنوان</label><input type="text" id="t" placeholder="مثلاً: کنترل LED با ESP32">
      <label>توضیحات</label><textarea id="d"></textarea>
      <div id="m-file"><label class="drop" id="dz"><input type="file" id="f" accept="video/*" hidden><span style="font-size:34px">🎬</span><b id="fn">ویدیو را اینجا بکشید و رها کنید</b><small>یا کلیک کنید و انتخاب کنید (حداکثر ۲۰ مگابایت)</small></label></div>
      <div id="m-yt" class="hide"><label>لینک ویدیو در یوتوب</label><input type="text" id="yl" dir="ltr" placeholder="https://www.youtube.com/watch?v=..."></div>
      <label>تصویر کاور (اختیاری)</label><input type="file" id="th" accept="image/*">
      <div class="bar" id="bar"><i id="bi"></i></div>
      <button id="up">آپلود</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="panel"><h2>مدیریت ویدیوها</h2><div id="list"></div></div>
    <div class="panel"><h2>ویرایش «درباره من»</h2>
      <label>نام</label><input type="text" id="an">
      <label>معرفی</label><textarea id="abio" style="min-height:110px"></textarea>
      <label>لینک کانال یوتوب (اختیاری)</label><input type="text" id="ay" dir="ltr" placeholder="https://www.youtube.com/@...">
      <button id="asave">ذخیره</button><div class="msg" id="amsg"></div>
    </div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
let videos=[],db=null,assets=null,user=null,isAdmin=false,q='';

function esc(s){const e=document.createElement('div');e.textContent=s;return e.innerHTML}
function render(){
  $('grid').innerHTML=videos.filter(v=>v.title.toLowerCase().includes(q.toLowerCase())).map(v=>`<div class="card">${v.yt?`<a class="yt" ${v.thumb?`style="background:linear-gradient(rgba(7,11,31,.35),rgba(7,11,31,.35)),url(${v.thumb}) center/cover"`:''} href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener"><span>▶</span><small>تماشا در یوتوب</small></a>`:`<video controls preload="metadata" ${v.thumb?`poster="${v.thumb}"`:''} src="${v.url}"></video>`}<div class="in"><h3>${esc(v.title)}</h3><p>${esc(v.desc||'')}</p>${v.yt?'':`<button class="dl" data-i="${v.id}">⬇ دانلود</button>`}</div></div>`).join('');
  $('empty').classList.toggle('hide',videos.length>0);
  $('list').innerHTML=videos.length?videos.map((v,i)=>`<div class="row"><span><span class="badge ${v.yt?'y':''}">${v.yt?'یوتوب':'فایل'}</span>${esc(v.title)}</span><button class="del" data-i="${i}">حذف</button></div>`).join(''):'<div class="empty">ویدیویی نیست</div>';
}
function route(){
  const h=location.hash==='#admin';
  $('home').classList.toggle('hide',h);$('admin').classList.toggle('hide',!h);
  $('nv-home').classList.toggle('on',!h);$('nv-admin').classList.toggle('on',h);
}
window.addEventListener('hashchange',route);
let about={name:'امیر',bio:'سلام، من امیرم! تو چنل Byte x Bold درباره پایتون، الکترونیک و تولید محتوا ویدیو می‌سازم و سعی می‌کنم مفاهیم فنی را ساده توضیح بدهم.',yt:''},filled=false;
function renderAbout(){
  $('ab-name').textContent=about.name;$('ab-bio').textContent=about.bio;
  const a=$('ab-yt');if(/^https:\/\//.test(about.yt||'')){a.href=about.yt;a.classList.remove('hide')}else a.classList.add('hide');
  if(!filled){$('an').value=about.name;$('abio').value=about.bio;$('ay').value=about.yt||'';filled=true}
}
$('asave').onclick=async()=>{
  about={name:$('an').value.trim()||'امیر',bio:$('abio').value.trim(),yt:$('ay').value.trim()};
  try{if(db)await db.doc('site/about').set(about);renderAbout();$('amsg').textContent='ذخیره شد ✓'}
  catch(e){$('amsg').textContent='خطا: '+(e.message||e.code||'نامشخص')}
};
let mode='file';
function setMode(m){mode=m;$('m-file').classList.toggle('hide',m!=='file');$('m-yt').classList.toggle('hide',m!=='yt');$('tb-file').classList.toggle('on',m==='file');$('tb-yt').classList.toggle('on',m==='yt')}
$('tb-file').onclick=()=>setMode('file');$('tb-yt').onclick=()=>setMode('yt');
function ytId(u){const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:null}
$('f').onchange=()=>{const f=$('f').files[0];if(f)$('fn').textContent=f.name+' ('+(f.size/1048576).toFixed(1)+' MB)'};
$('dz').ondragover=e=>{e.preventDefault();$('dz').classList.add('over')};
$('dz').ondragleave=()=>$('dz').classList.remove('over');
$('dz').ondrop=e=>{e.preventDefault();$('dz').classList.remove('over');if(e.dataTransfer.files.length){$('f').files=e.dataTransfer.files;$('f').onchange()}};

async function init(){
  try{
    user=await claude.use('user');
    isAdmin=user?user.canEdit()===true:false;
    db=await claude.use('db');
    assets=await claude.use('assets');
  }catch(e){}
  if(db&&!isAdmin)$('msg').textContent='توجه: شما صاحب این صفحه نیستید؛ آپلود فقط برای صاحب صفحه کار می‌کند.';
  if(!db){ // حالت آزمایشی محلی
    isAdmin=true;$('nv-admin').classList.remove('hide');
    $('msg').textContent='حالت محلی: ویدیوها فقط تا بستن صفحه می‌مانند.';
  }else{
    db.doc('site/about').onSnapshot(s=>{if(s.exists){about={...about,...s.data()};renderAbout()}},()=>{});
    let timer=setTimeout(()=>{},10000);
    db.collection('videos').onSnapshot(s=>{
      clearTimeout(timer);
      videos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.at||0)-(a.at||0));
      render();
    },()=>{});
  }
  route();render();renderAbout();
}
init();

$('up').onclick=async()=>{
  const file=$('f').files[0],title=$('t').value.trim(),yt=mode==='yt'?ytId($('yl').value.trim()):null;
  if(!title){$('msg').textContent='عنوان لازم است.';return}
  if(mode==='yt'&&!yt){$('msg').textContent='لینک یوتوب معتبر نیست.';return}
  if(mode==='file'&&!file){$('msg').textContent='یک فایل ویدیو انتخاب کنید.';return}
  const btn=$('up');btn.disabled=true;$('bar').style.display='block';$('bi').style.width='30%';
  try{
    let url='',aid=null;
    if(mode==='yt'){}
    else if(assets){
      const r=await assets.upload(file);url=r.url;aid=r.id;
    }else if(db){throw new Error('آپلود فایل فقط برای صاحب صفحه ممکن است. با اکانت Claude خودت وارد شو یا از تب لینک یوتوب استفاده کن.')}else{url=URL.createObjectURL(file)}
    let thumb=null,thumbId=null;const tf=$('th').files[0];
    if(tf){if(assets){const t=await assets.upload(tf);thumb=t.url;thumbId=t.id}else thumb=URL.createObjectURL(tf)}
    $('bi').style.width='80%';
    const v={title,desc:$('d').value.trim(),url,assetId:aid,thumb,thumbId,yt:yt||null,at:Date.now()};
    if(db){await db.collection('videos').doc('v'+v.at).set(v)}
    else{v.id='v'+v.at;videos.unshift(v);render()}
    $('bi').style.width='100%';$('msg').textContent='ویدیو با موفقیت اضافه شد ✓';
    $('t').value='';$('d').value='';$('f').value='';$('yl').value='';$('th').value='';$('fn').textContent='ویدیو را اینجا بکشید و رها کنید';
  }catch(e){$('msg').textContent='خطا در آپلود: '+(e.message||e.code||'نامشخص')}
  btn.disabled=false;setTimeout(()=>{$('bar').style.display='none';$('bi').style.width='0'},900);
};
$('s').oninput=()=>{q=$('s').value;render()};
$('grid').onclick=async e=>{
  const b=e.target.closest('.dl');if(!b)return;
  const v=videos.find(x=>x.id===b.dataset.i);if(!v)return;
  b.disabled=true;b.textContent='در حال آماده‌سازی...';
  try{
    const d=await claude.use('downloads');if(!d)throw 0;
    const bl=await (await fetch(v.url)).blob();
    let ext=(bl.type.split('/')[1]||'mp4').split(';')[0];if(ext==='quicktime')ext='mov';
    await d.save({filename:(v.title.replace(/[^\w\u0600-\u06FF -]/g,'')||'video')+'.'+ext,data:bl});
  }catch(err){window.open(v.url,'_blank')}
  b.disabled=false;b.textContent='⬇ دانلود';
};
$('list').onclick=async e=>{
  const b=e.target.closest('.del');if(!b)return;
  const v=videos[b.dataset.i];if(!v)return;
  if(!b.dataset.c){b.dataset.c=1;b.textContent='مطمئنی؟ دوباره بزن';setTimeout(()=>{delete b.dataset.c;b.textContent='حذف'},3000);return}
  try{
    if(db)await db.collection('videos').doc(v.id).delete();
    else{videos.splice(b.dataset.i,1);render()}
    if(assets&&v.assetId)await assets.delete(v.assetId);
    if(assets&&v.thumbId)await assets.delete(v.thumbId);
  }catch(err){$('msg').textContent='خطا در حذف: '+(err.message||err.code||'نامشخص')}
};
</script>
</body>
</html>
